# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO CP2 (student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi lại người dùng khi thiếu thông tin bắt buộc (như tên tài khoản Twitter/X hay đường dẫn URL) 
      hoặc yêu cầu xác nhận an toàn trước khi thực hiện hành động ghi/gửi bên ngoài (như `send`).
      DÙNG KHI: Không thể xác định đối tượng cụ thể hoặc cần sự đồng ý Yes/No của người dùng.
      KHÔNG DÙNG KHI: Đã có đủ thông tin hoặc câu hỏi ngoài phạm vi nghiên cứu (out-of-scope).
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "Câu hỏi ngắn gọn, đi thẳng vào vấn đề để gửi tới người dùng."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: "'text' khi hỏi bổ sung thông tin bị thiếu (URL, handle); 'yes_no' khi xin xác nhận trước khi gửi tin nhắn; 'choice' khi đưa ra các lựa chọn."
        options:
          type: array
          default: []
          items:
            type: string
          description: "Danh sách các lựa chọn khi response_type là 'choice'."
      required: [question]

  - name: timeline
    description: >-
      Lấy danh sách các bài đăng (tweets) gần đây từ MỘT tài khoản X/Twitter cụ thể.
      DÙNG KHI: Người dùng yêu cầu xem bài viết CỦA một người nổi tiếng/tài khoản rõ ràng.
      Ánh xạ tên người dùng sang handle Twitter không chứa ký tự '@' (ví dụ: Sam Altman -> 'sama', Elon Musk -> 'elonmusk', Andrej Karpathy -> 'karpathy').
      KHÔNG DÙNG KHI: Tìm kiếm bài viết theo chủ đề chung (dùng `social_search`) hoặc chưa biết tài khoản của ai (dùng `clarify`).
    parameters:
      type: object
      properties:
        screenname:
          type: string
          default: ""
          description: "Tên handle Twitter/X, tuyệt đối KHÔNG bao gồm ký tự '@' (ví dụ: 'sama', 'elonmusk', 'karpathy')."
        limit:
          type: integer
          default: 5
          description: "Số lượng bài đăng tối đa cần lấy."
      required: [screenname]

  - name: social_search
    description: >-
      Tìm kiếm bài đăng/tweet trên X/Twitter theo TỪ KHÓA hoặc CHỦ ĐỀ.
      DÙNG KHI: Tìm hiểu cộng đồng mạng xã hội đang thảo luận gì về một chủ đề (ví dụ: 'GPT-5', 'AI').
      KHÔNG DÙNG KHI: Lấy bài đăng từ một tài khoản cụ thể (dùng `timeline`).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Từ khóa hoặc chủ đề tìm kiếm trên Twitter."
        search_type:
          type: string
          enum: [Latest, Top]
          default: "Latest"
          description: "Đặt 'Top' khi người dùng hỏi các tweet phổ biến/nổi bật nhất; đặt 'Latest' khi cần tin mới nhất."
        limit:
          type: integer
          default: 5
          description: "Số lượng bài đăng trả về."
      required: [query]

  - name: lookup
    description: >-
      Tra cứu bài viết, tin tức hoặc dữ liệu chung trên internet qua công cụ tìm kiếm web.
      DÙNG KHI: Cần tra cứu tin tức thời sự, bài báo hoặc thông tin tổng quan trên internet.
      KHÔNG DÙNG KHI: Đã có đường dẫn URL cụ thể (dùng `fetch`) hoặc chỉ tìm bài đăng mạng xã hội (dùng `social_search`).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Từ khóa tìm kiếm THUẦN CHỦ ĐỀ (ví dụ: 'AI', 'robotics'). TUYỆT ĐỐI KHÔNG ghép các từ chỉ thể loại như 'news' hay 'tin tức' vào query khi đã chọn topic='news'."
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: "BẮT BUỘC đặt 'news' khi người dùng hỏi về tin tức/thời sự; đặt 'general' cho tra cứu thông tin chung."
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: "Khoảng thời gian: 'day' cho hôm nay, 'week' cho tuần này, 'month' cho tháng này."
        max_results:
          type: integer
          default: 5
          description: "Số lượng kết quả web tối đa."
      required: [query]

  - name: fetch
    description: >-
      Đọc và trích xuất nội dung từ MỘT địa chỉ URL web cụ thể.
      DÙNG KHI: Đầu vào chứa đường dẫn HTTP/HTTPS hợp lệ rõ ràng.
      KHÔNG DÙNG KHI: Người dùng nói 'bài viết này' nhưng không đưa URL (phải gọi `clarify` xin link).
    parameters:
      type: object
      properties:
        url:
          type: string
          default: ""
          description: "Địa chỉ URL đầy đủ cần truy cập và đọc nội dung (ví dụ: https://openai.com/blog/gpt-5)."
      required: [url]

  - name: format
    description: >-
      Tổng hợp các item nội dung đã thu thập thành văn bản Markdown theo cấu trúc mẫu.
      DÙNG KHI: Cần tổng hợp dữ liệu thu thập từ các bước trước thành bản tin hoặc danh sách bài viết.
      KHÔNG DÙNG KHI: Chưa thu thập đủ dữ liệu.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các item dữ liệu thu thập được."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template:
          type: string
          enum: [brief, sections, bullets, thread, daily_ai_vn]
          default: "sections"
          description: "Mẫu bố cục đầu ra."
        headline:
          type: string
          default: ""
          description: "Tiêu đề chính của bản tin."
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Gửi tin nhắn hoặc bài viết lên kênh Telegram bên ngoài.
      RANH GIỚI AN TOÀN BẮT BUỘC: CHỈ ĐƯỢC PHÉP GỌI khi người dùng ĐÃ XÁC NHẬN đồng ý (confirmed=true).
      Ở lượt đầu tiên khi người dùng yêu cầu đăng/gửi, KHÔNG ĐƯỢC gọi `send` trực tiếp mà phải gọi `clarify` với response_type='yes_no' để xin xác nhận trước.
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: "Nội dung văn bản chi tiết cần gửi."
        confirmed:
          type: boolean
          default: false
          description: "Đặt true CHỈ KHI người dùng đã duyệt xác nhận ở lượt tương tác."
      required: [text]

  - name: policy
    description: >-
      Tra cứu quy định, chính sách nội bộ và tiêu chuẩn tuân thủ của tổ chức.
      DÙNG KHI: Cần xác minh trích dẫn nguồn, bảo mật dữ liệu, xuất bản bên ngoài hoặc quy định dùng tool.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Từ khóa tra cứu chính sách."
        policy_area:
          type: string
          enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage]
          default: "all"
          description: "Lĩnh vực quy định cần tra cứu."
        top_k:
          type: integer
          default: 3
          description: "Số lượng quy định tối đa trả về."
      required: [query]

  - name: papers
    description: >-
      Tìm kiếm bài báo nghiên cứu khoa học và preprint trên arXiv.
      DÙNG KHI: Người dùng yêu cầu tìm tài liệu nghiên cứu, công trình học thuật hoặc bài báo arXiv.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Từ khóa hoặc tên đề tài nghiên cứu học thuật."
        max_results:
          type: integer
          default: 5
          description: "Số bài báo tối đa trả về."
        sort_by:
          type: string
          enum: [relevance, lastUpdatedDate, submittedDate]
          default: "relevance"
          description: "Tiêu chí sắp xếp bài báo."
      required: [query]

  - name: paper_text
    description: >-
      Tải và đọc toàn bộ nội dung văn bản của một bài báo trên arXiv.
      DÙNG KHI: Đã có arXiv ID hoặc đường dẫn bài báo arXiv cụ thể.
    parameters:
      type: object
      properties:
        arxiv_url:
          type: string
          default: ""
          description: "Mã arXiv ID (ví dụ: '2310.06825') hoặc đường dẫn URL đầy đủ."
        max_pages:
          type: integer
          default: 5
          description: "Số trang tối đa trích xuất."
        max_chars:
          type: integer
          default: 8000
          description: "Giới hạn ký tự tối đa."
      required: [arxiv_url]

  # ---------------- Custom Group Tool (CP3 Requirement) ----------------
  - name: trending_topics
    description: >-
      Trích xuất các chủ đề, xu hướng công nghệ hoặc từ khóa HOT đang được quan tâm nhất hiện tại.
      DÙNG KHI: Người dùng hỏi chung về các xu hướng công nghệ/AI mới nổi mà không đưa từ khóa cụ thể.
      KHÔNG DÙNG KHI: Đã có từ khóa tra cứu rõ ràng.
    parameters:
      type: object
      properties:
        category:
          type: string
          enum: [ai, tech, science, general]
          default: "ai"
          description: "Lĩnh vực cần lấy xu hướng nổi bật."
        limit:
          type: integer
          default: 5
          description: "Số lượng chủ đề xu hướng tối đa trả về."
      required: [category]